<div class="flex flex-col">
    <dt class="text-4xl flex items-center font-semibold hx-text-gray-900 dark:hx-text-gray-100">
      <p class="mx-6">
        {{ partial "utils/icon.html" (dict "name" (.Get "icon" | default "github" ) "attributes" "height=40") }}
      </p>
        {{ .Get "title" }}
    </dt>
    <dd class="text-lg flex flex-auto flex-col leading-7 hx-text-gray-600 dark:hx-text-gray-300">
        {{ .Inner | .Page.RenderString }}
    </dd>
</div>
